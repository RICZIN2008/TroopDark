```html
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TroopDark</title>

<style>
:root{
  --bg:#121212;
  --card:#1e1e1e;
  --text:#fff;
  --muted:#aaa;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:var(--bg);
  color:var(--text);
  font-family:Arial,sans-serif;
}

.hero{
  background:#000;
  padding:25px;
  text-align:center;
  font-weight:bold;
  font-size:22px;
}

.container{
  padding:15px;
}

.title-cat{
  margin:18px 0 10px;
  color:var(--muted);
  font-size:13px;
}

.cards{
  display:flex;
  gap:12px;
  overflow-x:auto;
  scroll-behavior:smooth;
}

.cards::-webkit-scrollbar{
  display:none;
}

.card{
  min-width:160px;
  background:var(--card);
  border-radius:12px;
  overflow:hidden;
  flex-shrink:0;
}

.card img{
  width:100%;
  height:150px;
  object-fit:cover;
  background:#111;
}

.info{
  padding:10px;
}

.nome{
  font-size:13px;
  font-weight:bold;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.tipo{
  font-size:11px;
  color:var(--muted);
  margin:6px 0;
}

.btn{
  display:block;
  text-align:center;
  text-decoration:none;
  background:#25D366;
  color:#fff;
  padding:8px;
  border-radius:7px;
  font-size:12px;
  font-weight:bold;
}

.loading{
  color:#888;
  padding:10px;
}
</style>
</head>

<body>

<div class="hero">
  TROOPDARK
</div>

<div class="container">

  <!-- GRUPOS -->
  <div class="title-cat">GRUPOS ⌄</div>
  <div class="cards" id="grupos">
    <div class="loading">Carregando...</div>
  </div>

  <!-- CANAIS -->
  <div class="title-cat">CANAIS ⌄</div>
  <div class="cards" id="canais">
    <div class="loading">Carregando...</div>
  </div>

</div>

<script>
// SUA API
const API_KEY = "b3ba21d7cd62217efa87018bfdfa240f";

// LINKS DOS GRUPOS
const grupos = [
  "https://chat.whatsapp.com/LBQmatzACkd7T71mcMB5hM"
];

// LINKS DOS CANAIS
const canais = [
  "https://whatsapp.com/channel/0029Vb7ZerTBqbr5oNdmst01"
];

// PEGAR PREVIEW
async function obterPreview(link){

  try{

    const api =
      `https://api.linkpreview.net/?key=${API_KEY}&q=${encodeURIComponent(link)}`;

    const res = await fetch(api);
    const data = await res.json();

    console.log(data);

    let imagem = data.image;

    // caso imagem falhe
    if(
      !imagem ||
      imagem.includes("logo") ||
      imagem.includes("favicon")
    ){
      imagem =
      "https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg";
    }

    return {
      nome: data.title || "WhatsApp",
      imagem
    };

  }catch(e){

    return {
      nome:"WhatsApp",
      imagem:
      "https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg"
    };

  }
}

// CRIAR CARD
function criarCard({nome, imagem, link, tipo}){

  return `
  
  <div class="card">

    <img src="${imagem}" loading="lazy">

    <div class="info">

      <div class="nome">
        ${nome}
      </div>

      <div class="tipo">
        ${tipo === "canal" ? "Canal" : "Grupo"}
      </div>

      <a
        href="${link}"
        target="_blank"
        class="btn"
      >
        Entrar
      </a>

    </div>

  </div>

  `;
}

// RENDERIZAR
async function renderizar(lista, elemento, tipo){

  elemento.innerHTML = "";

  for(const link of lista){

    const dados = await obterPreview(link);

    elemento.innerHTML += criarCard({
      nome:dados.nome,
      imagem:dados.imagem,
      link,
      tipo
    });

  }

}

// INICIAR
renderizar(
  grupos,
  document.getElementById("grupos"),
  "grupo"
);

renderizar(
  canais,
  document.getElementById("canais"),
  "canal"
);

</script>

</body>
</html>
```
