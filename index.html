<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TroopDark</title>

<style>
:root{
  --bg:#121212;
  --card:#1e1e1e;
  --text:#fff;
  --muted:#aaa;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:var(--bg);
  color:var(--text);
  font-family:Arial,sans-serif;
}

.hero{
  background:#000;
  padding:25px;
  text-align:center;
  font-weight:bold;
  font-size:22px;
}

.container{
  padding:15px;
}

.title-cat{
  margin:18px 0 10px;
  color:var(--muted);
  font-size:13px;
}

.cards{
  display:flex;
  gap:12px;
  overflow-x:auto;
  scroll-behavior:smooth;
}

.cards::-webkit-scrollbar{
  display:none;
}

.card{
  min-width:160px;
  background:var(--card);
  border-radius:12px;
  overflow:hidden;
  flex-shrink:0;
}

.card img{
  width:100%;
  height:150px;
  object-fit:cover;
  background:#111;
}

.info{
  padding:10px;
}

.nome{
  font-size:13px;
  font-weight:bold;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.tipo{
  font-size:11px;
  color:var(--muted);
  margin:6px 0;
}

.btn{
  display:block;
  text-align:center;
  text-decoration:none;
  background:#25D366;
  color:#fff;
  padding:8px;
  border-radius:7px;
  font-size:12px;
  font-weight:bold;
}

.loading{
  color:#888;
  padding:10px;
}
</style>
</head>

<body>

<div class="hero">
  TROOPDARK
</div>

<div class="container">

  <!-- GRUPO -->

  <div class="title-cat">
    GRUPO ⌄
  </div>

  <div class="cards" id="grupoPrincipal"></div>

  <!-- CANAL -->

  <div class="title-cat">
    CANAL ⌄
  </div>

  <div class="cards" id="canais">
    <div class="loading">Carregando...</div>
  </div>

  <!-- GRUPOS PARCEIROS -->

  <div class="title-cat">
    GRUPOS PARCEIROS ⌄
  </div>

  <div class="cards" id="gruposParceiros"></div>

  <!-- CANAIS PARCEIROS -->

  <div class="title-cat">
    CANAIS PARCEIROS ⌄
  </div>

  <div class="cards" id="canaisParceiros">
    <div class="loading">Carregando...</div>
  </div>

</div>

<script>

// API
const API_KEY =
"b3ba21d7cd62217efa87018bfdfa240f";

// =====================================
// GRUPO PRINCIPAL
// FOTO + NOME MANUAL
// =====================================

const grupoPrincipal = {

nome:"TroopDark",

foto:
"https://i.imgur.com/2s9X7Zy.jpeg",

link:
"https://chat.whatsapp.com/LBQmatzACkd7T71mcMB5hM"

};

// =====================================
// CANAL PRINCIPAL
// AUTOMÁTICO
// =====================================

const canais = [

"https://whatsapp.com/channel/0029Vb7ZerTBqbr5oNdmst01"

];

// =====================================
// GRUPOS PARCEIROS
// FOTO + NOME MANUAL
// =====================================

const gruposParceiros = [

{
  nome:"Grupo Parceiro",

  foto:
"https://i.imgur.com/2s9X7Zy.jpeg",

  link:
"https://chat.whatsapp.com/LINK"
}

];

// =====================================
// CANAIS PARCEIROS
// AUTOMÁTICO
// =====================================

const canaisParceiros = [

"https://whatsapp.com/channel/0029VbCZdnDJP21Amqx92B2z"

];

// =====================================
// PEGAR PREVIEW
// =====================================

async function obterPreview(link){

  try{

    const api =
      `https://api.linkpreview.net/?key=${API_KEY}&q=${encodeURIComponent(link)}`;

    const res = await fetch(api);

    const data = await res.json();

    console.log(data);

    let imagem = data.image;

    if(
      !imagem ||
      imagem.includes("logo") ||
      imagem.includes("favicon")
    ){

      imagem =
      "https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg";

    }

    return {

      nome:
      data.title || "WhatsApp",

      imagem

    };

  }catch(e){

    return {

      nome:"WhatsApp",

      imagem:
      "https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg"

    };

  }

}

// =====================================
// CRIAR CARD
// =====================================

function criarCard({
nome,
imagem,
link,
tipo
}){

  return `
  
  <div class="card">

    <img
    src="${imagem}"
    loading="lazy"
    >

    <div class="info">

      <div class="nome">
        ${nome}
      </div>

      <div class="tipo">
        ${tipo}
      </div>

      <a
        href="${link}"
        target="_blank"
        class="btn"
      >
        Entrar
      </a>

    </div>

  </div>

  `;

}

// =====================================
// GRUPO PRINCIPAL
// =====================================

function renderizarGrupoPrincipal(){

const el =
document.getElementById(
"grupoPrincipal"
);

el.innerHTML =
criarCard({

nome:
grupoPrincipal.nome,

imagem:
grupoPrincipal.foto,

link:
grupoPrincipal.link,

tipo:
"Grupo"

});

}

// =====================================
// CANAIS
// =====================================

async function renderizarCanais(){

const el =
document.getElementById(
"canais"
);

el.innerHTML = "";

for(const link of canais){

const dados =
await obterPreview(link);

el.innerHTML += criarCard({

nome:
dados.nome,

imagem:
dados.imagem,

link,

tipo:
"Canal"

});

}

}

// =====================================
// GRUPOS PARCEIROS
// =====================================

function renderizarGruposParceiros(){

const el =
document.getElementById(
"gruposParceiros"
);

el.innerHTML = "";

gruposParceiros.forEach(grupo => {

el.innerHTML += criarCard({

nome:
grupo.nome,

imagem:
grupo.foto,

link:
grupo.link,

tipo:
"Grupo Parceiro"

});

});

}

// =====================================
// CANAIS PARCEIROS
// =====================================

async function renderizarCanaisParceiros(){

const el =
document.getElementById(
"canaisParceiros"
);

el.innerHTML = "";

for(const link of canaisParceiros){

const dados =
await obterPreview(link);

el.innerHTML += criarCard({

nome:
dados.nome,

imagem:
dados.imagem,

link,

tipo:
"Canal Parceiro"

});

}

}

// =====================================
// INICIAR
// =====================================

renderizarGrupoPrincipal();

renderizarCanais();

renderizarGruposParceiros();

renderizarCanaisParceiros();

</script>

</body>
</html>
